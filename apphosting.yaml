# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# Environment variables and secrets
# These names MUST match the names of the secrets you create in Google Cloud Secret Manager.
env:
  - variable: gemini_api_key
    secret: gemini_api_key
    availability:
      - RUNTIME
  - variable: resend_api_key
    secret: resend_api_key
    availability:
      - RUNTIME
  - variable: upstash_redis_rest_url
    secret: upstash_redis_rest_url
    availability:
      - RUNTIME
  - variable: upstash_redis_rest_token
    secret: upstash_redis_rest_token
    availability:
      - RUNTIME
  - variable: next_public_admin_email
    secret: next_public_admin_email
    availability:
      - BUILD
      - RUNTIME